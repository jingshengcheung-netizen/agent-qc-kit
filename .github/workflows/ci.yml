name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Gate sample-fail must fail
        run: |
          if PYTHONPATH=src python3 -m agent_qc_kit examples/sample-fail.md; then
            echo "expected fail" >&2; exit 1
          fi
      - name: Gate sample-pass must pass
        run: PYTHONPATH=src python3 -m agent_qc_kit examples/sample-pass.md
